<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <form id="form-cadastro">

        <h1 class="text-[35px] text-center text-aliceblue mb-[30px] font-[Verdana,Geneva,Tahoma,sans-serif]">Cadastro</h1>

        <label for="email" class="block text-[14px] text-[rgba(233,233,233,0.75)] mb-2">E-mail:</label>
        <input type="email" id="email" name="email" class="w-full bg-[rgb(19,19,19)] text-[rgb(219,219,219)] border border-white/10 rounded-[10px] mb-5 px-[15px] py-[13px]" required>

        <label for="senha" class="block text-[14px] text-[rgba(233,233,233,0.75)] mb-2">Senha:</label>
        <input type="password" id="senha" name="senha" class="w-full bg-[rgb(19,19,19)] text-[rgb(219,219,219)] border border-white/10 rounded-[10px] mb-5 px-[15px] py-[13px]" required>

        <label for="confirmacao-senha" class="block text-[14px] text-[rgba(233,233,233,0.75)] mb-2">Confirme sua Senha:</label>
        <input type="password" id="confirme-senha" name="senha" class="w-full bg-[rgb(19,19,19)] text-[rgb(219,219,219)] border border-white/10 rounded-[10px] mb-5 px-[15px] py-[13px]" required>

        <button type="submit" class="button">Cadastrar-se</button>

        <a href="index.html"><p>Sair</p></a>
    </form>

    </section>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="cadastro.js"></script>
</body>
</html>
