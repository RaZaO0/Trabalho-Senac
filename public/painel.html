<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Adm</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="container-painel">

    <section id="PainelAdmin">
        <form id="formProdutos" class="flex flex-col gap-4">

            <h1>Painel Adm</h1>

            <label for="nome">Digite o nome do produto:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="categoria">Digite a categoria do produto:</label>
            <input type="text" id="categoria" name="categoria" required>

            <label for="preco">Digite o valor:</label>
            <input type="number" id="preco" name="preco" required>

            <label>Imagem do produto:</label>
            <input type="file" id="imagem" name="imagem" accept="image/*" required>

            <button type="submit" class="button">Cadastrar Produto</button>

            <a href="index.html">
                <p id="botaoSair">Sair</p>
            </a>

            <h2>Produtos cadastrados</h2>
            <p id="quantidadeProdutos">Carregando...</p>

        </form>
    </section>

    <section class="painel-graficos">
        <h2>Gráficos de produtos</h2>

        <img id="graficos" alt="Gráficos dos produtos">

        <button type="button" id="botaoGraficos" class="button">
            Gerar gráficos
        </button>
    </section>

</div>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="script.js"></script>
</body>

</html>
